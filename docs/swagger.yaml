basePath: /
definitions:
  model.AffiliationResponse:
    properties:
      id:
        type: integer
      std_name:
        type: string
    type: object
  model.AuthResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/model.UserResponse'
    type: object
  model.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  model.ProjectCreateRequest:
    properties:
      affiliation_id:
        type: integer
      description:
        type: string
      form_end_day:
        description: RFC3339
        type: string
      form_start_day:
        description: RFC3339
        type: string
      name:
        type: string
      num_max:
        type: integer
      project_end_day:
        description: RFC3339
        type: string
      project_start_day:
        description: RFC3339
        type: string
    required:
    - affiliation_id
    - form_end_day
    - form_start_day
    - name
    - num_max
    - project_end_day
    - project_start_day
    type: object
  model.ProjectResponse:
    properties:
      affiliation:
        $ref: '#/definitions/model.AffiliationResponse'
      affiliation_id:
        type: integer
      community_user:
        $ref: '#/definitions/model.UserResponse'
      community_user_id:
        type: integer
      created_at:
        type: string
      description:
        type: string
      form_end_day:
        type: string
      form_start_day:
        type: string
      id:
        type: integer
      name:
        type: string
      num_attending:
        type: integer
      num_max:
        type: integer
      project_end_day:
        type: string
      project_start_day:
        type: string
    type: object
  model.ProjectUpdateRequest:
    properties:
      description:
        type: string
      form_end_day:
        description: RFC3339
        type: string
      form_start_day:
        description: RFC3339
        type: string
      name:
        type: string
      num_max:
        type: integer
      project_end_day:
        description: RFC3339
        type: string
      project_start_day:
        description: RFC3339
        type: string
    type: object
  model.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  model.RegisterRequest:
    properties:
      affiliation_id:
        type: integer
      email:
        type: string
      full_name:
        type: string
      password:
        minLength: 6
        type: string
      role:
        allOf:
        - $ref: '#/definitions/model.Role'
        enum:
        - admin
        - student
        - school
        - community
      student_id:
        type: string
      username:
        type: string
    required:
    - affiliation_id
    - email
    - full_name
    - password
    - role
    - username
    type: object
  model.RegisterResponse:
    properties:
      access_token:
        type: string
      message:
        type: string
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/model.UserResponse'
    type: object
  model.Role:
    enum:
    - admin
    - student
    - school
    - community
    type: string
    x-enum-varnames:
    - RoleAdmin
    - RoleStudent
    - RoleSchool
    - RoleCommunity
  model.UserResponse:
    properties:
      affiliation:
        $ref: '#/definitions/model.AffiliationResponse'
      affiliation_id:
        type: integer
      email:
        type: string
      full_name:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      role:
        $ref: '#/definitions/model.Role'
      student_id:
        type: string
      username:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Backend API for the register system with JWT auth and role-based access.
  title: Register System API
  version: "1.0"
paths:
  /admin/users/{id}/accept:
    post:
      description: Activates a user account so they can login
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.UserResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Accept a pending user
      tags:
      - Admin
  /admin/users/{id}/reject:
    post:
      description: Keeps the user account inactive
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Reject a pending user
      tags:
      - Admin
  /admin/users/pending:
    get:
      description: Returns all users awaiting approval
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.UserResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List pending users
      tags:
      - Admin
  /affiliations:
    get:
      description: Returns all valid affiliations for register form
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.AffiliationResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get all affiliations
      tags:
      - Affiliation
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user and returns JWT tokens. Only active accounts
        can login.
      parameters:
      - description: Login request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.AuthResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login
      tags:
      - Auth
  /auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.UserResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - Auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.AuthResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Refresh tokens
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates an inactive account pending admin approval
      parameters:
      - description: Register request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.RegisterResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new user
      tags:
      - Auth
  /projects:
    post:
      consumes:
      - application/json
      description: Create a project (community/admin)
      parameters:
      - description: Create project
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.ProjectCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.ProjectResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create project
      tags:
      - Project
  /projects/{id}:
    patch:
      consumes:
      - application/json
      description: Update a project (owner community/admin)
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      - description: Update project
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.ProjectUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.ProjectResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update project
      tags:
      - Project
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
