basePath: /
definitions:
  model.AffiliationCreateRequest:
    properties:
      description:
        type: string
      std_name:
        type: string
    required:
    - std_name
    type: object
  model.AffiliationResponse:
    properties:
      description:
        type: string
      id:
        type: integer
      std_name:
        type: string
    type: object
  model.AffiliationUpdateRequest:
    properties:
      description:
        type: string
      std_name:
        type: string
    type: object
  model.ApplicationActionRequest:
    properties:
      action:
        enum:
        - approve
        - reject
        type: string
      application_ids:
        items:
          type: integer
        minItems: 1
        type: array
    required:
    - action
    - application_ids
    type: object
  model.ApplicationStatus:
    enum:
    - SCHOOL_PENDING
    - SCHOOL_REJECT
    - COMMUNITY_PENDING
    - COMMUNITY_REJECT
    - APPROVED
    type: string
    x-enum-varnames:
    - StatusSchoolPending
    - StatusSchoolReject
    - StatusCommunityPending
    - StatusCommunityReject
    - StatusApproved
  model.AuthResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/model.UserResponse'
    type: object
  model.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  model.ProjectCreateRequest:
    properties:
      affiliation_id:
        type: integer
      description:
        type: string
      form_end_day:
        type: string
      form_start_day:
        type: string
      name:
        type: string
      num_max:
        type: integer
      project_end_day:
        type: string
      project_start_day:
        type: string
    required:
    - affiliation_id
    - form_end_day
    - form_start_day
    - name
    - num_max
    - project_end_day
    - project_start_day
    type: object
  model.ProjectResponse:
    properties:
      affiliation:
        $ref: '#/definitions/model.AffiliationResponse'
      affiliation_id:
        type: integer
      banner_url:
        type: string
      community_user:
        $ref: '#/definitions/model.UserResponse'
      community_user_id:
        type: integer
      created_at:
        type: string
      date_approved:
        type: string
      description:
        type: string
      form_end_day:
        type: string
      form_start_day:
        type: string
      id:
        type: integer
      name:
        type: string
      num_attending:
        type: integer
      num_max:
        type: integer
      project_end_day:
        type: string
      project_start_day:
        type: string
    type: object
  model.ProjectUpdateRequest:
    properties:
      description:
        type: string
      form_end_day:
        type: string
      form_start_day:
        type: string
      name:
        type: string
      num_max:
        type: integer
      project_end_day:
        type: string
      project_start_day:
        type: string
    type: object
  model.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  model.RegisterRequest:
    properties:
      affiliation_id:
        type: integer
      email:
        type: string
      full_name:
        type: string
      password:
        minLength: 6
        type: string
      phone:
        type: string
      role:
        allOf:
        - $ref: '#/definitions/model.Role'
        enum:
        - admin
        - student
        - school
        - community
      student_id:
        type: string
      username:
        type: string
    required:
    - affiliation_id
    - email
    - full_name
    - password
    - role
    - username
    type: object
  model.RegisterResponse:
    properties:
      access_token:
        type: string
      message:
        type: string
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/model.UserResponse'
    type: object
  model.Role:
    enum:
    - admin
    - student
    - school
    - community
    type: string
    x-enum-varnames:
    - RoleAdmin
    - RoleStudent
    - RoleSchool
    - RoleCommunity
  model.StudentProjectResponse:
    properties:
      created_at:
        type: string
      id:
        type: integer
      project:
        $ref: '#/definitions/model.ProjectResponse'
      project_id:
        type: integer
      status:
        $ref: '#/definitions/model.ApplicationStatus'
      user:
        $ref: '#/definitions/model.UserResponse'
      user_id:
        type: integer
    type: object
  model.UserResponse:
    properties:
      affiliation:
        $ref: '#/definitions/model.AffiliationResponse'
      affiliation_id:
        type: integer
      avatar_url:
        type: string
      email:
        type: string
      full_name:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      phone:
        type: string
      role:
        $ref: '#/definitions/model.Role'
      student_id:
        type: string
      username:
        type: string
    type: object
  model.UserUpdateRequest:
    properties:
      full_name:
        type: string
      phone:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Backend API for the register system with JWT auth and role-based access.
  title: Register System API
  version: "1.0"
paths:
  /admins/affiliations:
    post:
      consumes:
      - application/json
      description: Add a new affiliation
      parameters:
      - description: Affiliation data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.AffiliationCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.AffiliationResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create affiliation
      tags:
      - Admin
  /admins/affiliations/{id}:
    delete:
      description: Remove an affiliation by ID
      parameters:
      - description: Affiliation ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete affiliation
      tags:
      - Admin
    patch:
      consumes:
      - application/json
      description: Update an existing affiliation
      parameters:
      - description: Affiliation ID
        in: path
        name: id
        required: true
        type: integer
      - description: Update fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.AffiliationUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.AffiliationResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update affiliation
      tags:
      - Admin
  /admins/applications:
    get:
      description: Admin view of all student applications
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.StudentProjectResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List all applications
      tags:
      - Admin
  /admins/projects:
    get:
      description: Admin master view of all projects
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.ProjectResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List all projects
      tags:
      - Admin
  /admins/users/{id}/accept:
    post:
      description: Approve a pending user account
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.UserResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Accept user
      tags:
      - Admin
  /admins/users/{id}/reject:
    post:
      description: Reject a pending user account
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Reject user
      tags:
      - Admin
  /admins/users/pending:
    get:
      description: Get all users awaiting approval
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.UserResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List pending users
      tags:
      - Admin
  /affiliations:
    get:
      description: Returns all valid affiliations for register form
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.AffiliationResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get all affiliations
      tags:
      - Affiliation
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login with username and password. Inactive users cannot login.
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.AuthResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login
      tags:
      - Auth
  /auth/me:
    get:
      description: Get the profile of the currently authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.UserResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - Auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Get new access/refresh token pair using a valid refresh token
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.AuthResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Refresh tokens
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Register a new user account. Account starts inactive until admin
        approves.
      parameters:
      - description: Register data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.RegisterResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register user
      tags:
      - Auth
  /communities/applicants/action:
    post:
      consumes:
      - application/json
      description: Batch accept or reject applications as a community
      parameters:
      - description: Action data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.ApplicationActionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Community action on applications
      tags:
      - Community
  /communities/projects:
    get:
      description: Get all approved projects for the community's affiliation
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.ProjectResponse'
            type: array
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List community projects
      tags:
      - Community
  /communities/projects/{id}/applicants:
    get:
      description: Get all applications for a project (community view)
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.StudentProjectResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List applicants for community
      tags:
      - Community
  /projects:
    post:
      consumes:
      - application/json
      description: Create a new project (school or community only)
      parameters:
      - description: Project data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.ProjectCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.ProjectResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create project
      tags:
      - Project
  /projects/{id}:
    patch:
      consumes:
      - application/json
      description: Update a project owned by the current user
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      - description: Update fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.ProjectUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.ProjectResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update project
      tags:
      - Project
  /projects/{id}/banner:
    post:
      consumes:
      - multipart/form-data
      description: Upload a banner image for a project
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      - description: Banner image
        in: formData
        name: banner
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.ProjectResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Upload project banner
      tags:
      - Project
  /schools/applicants/action:
    post:
      consumes:
      - application/json
      description: Batch accept or reject applications as a school
      parameters:
      - description: Action data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.ApplicationActionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: School action on applications
      tags:
      - School
  /schools/projects:
    get:
      description: Get all projects belonging to the school's affiliation
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.ProjectResponse'
            type: array
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List school projects
      tags:
      - School
  /schools/projects/{id}/applicants:
    get:
      description: Get all applications for a project (school view)
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.StudentProjectResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List applicants for school
      tags:
      - School
  /schools/projects/{id}/approve:
    post:
      description: School approves a pending project
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.ProjectResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Approve project
      tags:
      - School
  /schools/projects/pending:
    get:
      description: Get projects pending approval in the school's affiliation
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.ProjectResponse'
            type: array
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List pending school projects
      tags:
      - School
  /students/applications:
    get:
      description: Get all applications submitted by the current student
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.StudentProjectResponse'
            type: array
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List student applications
      tags:
      - Student
  /students/projects:
    get:
      description: Get approved projects available in the student's affiliation
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.ProjectResponse'
            type: array
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List approved projects for student
      tags:
      - Student
  /students/projects/{id}/apply:
    post:
      description: Student applies to a project by its ID
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.StudentProjectResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Apply to project
      tags:
      - Student
  /users/me:
    patch:
      consumes:
      - application/json
      description: Update current user's contact information (full_name, phone)
      parameters:
      - description: Profile fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/model.UserUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.UserResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update profile
      tags:
      - User
  /users/me/avatar:
    post:
      consumes:
      - multipart/form-data
      description: Upload a profile picture for the current user
      parameters:
      - description: Avatar image
        in: formData
        name: avatar
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.UserResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Upload avatar
      tags:
      - User
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
