name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  check-source-branch:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Ensure PR targets main only from develop
        run: |
          if [ "${{ github.head_ref }}" != "develop" ]; then
            echo "::error::PRs to main must come from develop. Current source: ${{ github.head_ref }}"
            exit 1
          fi

  build-and-test:
    runs-on: ubuntu-latest
    needs: check-source-branch
    if: always() && (needs.check-source-branch.result == 'success' || needs.check-source-branch.result == 'skipped')

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: register_system_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Download dependencies
        run: go mod tidy

      - name: Build
        run: go build ./cmd/server

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./business/ -v -race

      - name: E2E tests
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: register_system_test
        run: go test ./tests/ -v -race -timeout 60s
