openapi: 3.0.3
info:
  title: Register System API
  version: 1.0.0
  description: Backend API for the register system with JWT auth and role-based access.

servers:
  - url: http://localhost:8080

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Role:
      type: string
      enum: [admin, student, school, community]

    Affiliation:
      type: object
      properties:
        id:
          type: integer
          example: 1
        std_name:
          type: string
          example: School of Engineering

    RegisterRequest:
      type: object
      required: [username, full_name, password, email, affiliation_id]
      properties:
        username:
          type: string
          example: john_doe
        full_name:
          type: string
          example: John Doe
        password:
          type: string
          minLength: 6
          example: secret123
        email:
          type: string
          format: email
          example: john@example.com
        student_id:
          type: string
          example: STU2024001
        affiliation_id:
          type: integer
          example: 1

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: john_doe
        password:
          type: string
          example: secret123

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    UserResponse:
      type: object
      properties:
        user_id:
          type: integer
          example: 1
        username:
          type: string
          example: john_doe
        full_name:
          type: string
          example: John Doe
        role:
          $ref: '#/components/schemas/Role'
        is_active:
          type: boolean
          example: false
        student_id:
          type: string
          example: STU2024001
        email:
          type: string
          example: john@example.com
        affiliation_id:
          type: integer
          example: 1
        affiliation:
          $ref: '#/components/schemas/Affiliation'

    RegisterResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/UserResponse'
        message:
          type: string
          example: account pending admin approval

    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        user:
          $ref: '#/components/schemas/UserResponse'

    ErrorResponse:
      type: object
      properties:
        error:
          type: string

tags:
  - name: Auth
    description: Authentication endpoints
  - name: Admin
    description: Admin-only endpoints

paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      description: Creates an inactive account pending admin approval.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created (pending approval)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      description: Authenticates a user and returns JWT tokens. Only active accounts can login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Tokens refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid or revoked refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user info
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UserResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/users/pending:
    get:
      tags: [Admin]
      summary: List pending users
      description: Returns all users awaiting approval.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of pending users
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (admin only)

  /admin/users/{id}/accept:
    post:
      tags: [Admin]
      summary: Accept a pending user
      description: Activates a user account so they can login.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UserResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (admin only)
        '404':
          description: User not found

  /admin/users/{id}/reject:
    post:
      tags: [Admin]
      summary: Reject a pending user
      description: Keeps the user account inactive.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: user rejected
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (admin only)
        '404':
          description: User not found
